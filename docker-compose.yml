services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hme_intelligence
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for Real-time layer (WebSockets)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Migration Runner (Runs once and exits)
  migration-runner:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm run migrate
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
    depends_on:
      - postgres

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./logs/api-gateway:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - INTELLIGENCE_SERVICE_URL=http://intelligence-service:3001
      - AUTH_SERVICE_URL=http://auth-service:3002
      - FLEET_SERVICE_URL=http://fleet-service:3003
      - INGESTION_SERVICE_URL=http://ingestion-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    depends_on:
      - postgres
      - redis
      - migration-runner

  # Component Intelligence Service
  intelligence-service:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/component-intelligence-service
    ports:
      - "3001:3001"
    volumes:
      - ./logs/intelligence-service:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - PORT=3001
    depends_on:
      - postgres
      - migration-runner

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/auth-service
    ports:
      - "3002:3002"
    volumes:
      - ./logs/auth-service:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - PORT=3002
    depends_on:
      - postgres
      - migration-runner

  # Fleet Intelligence Service
  fleet-service:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/fleet-intelligence-service
    ports:
      - "3003:3003"
    volumes:
      - ./logs/fleet-service:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - PORT=3003
    depends_on:
      - postgres
      - migration-runner

  # Data Ingestion Service
  ingestion-service:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/data-ingestion-service
    ports:
      - "3004:3004"
    volumes:
      - ./logs/ingestion-service:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - PORT=3004
    depends_on:
      - postgres
      - migration-runner

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: npm start --workspace=services/notification-service
    ports:
      - "3005:3005"
    volumes:
      - ./logs/notification-service:/app/logs
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/hme_intelligence
      - PORT=3005
    depends_on:
      - postgres
      - migration-runner

  # pgAdmin for Database Visualization
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
