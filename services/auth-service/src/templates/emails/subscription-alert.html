<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 0; color: #333; }
        .wrapper { background-color: #f9f9f9; padding: 40px 0; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e1e1e1; }
        .header { background: #ffffff; padding: 25px; text-align: center; border-bottom: 1px solid #eee; }
        .content { padding: 40px; color: #2d3748; }
        .revenue-badge { display: inline-block; background: #f0fff4; color: #276749; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; border: 1px solid #c6f6d5; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .data-table td { padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .label { color: #888; width: 150px; }
        .value { color: #111; font-weight: bold; }
        .footer { padding: 20px; text-align: center; font-size: 11px; color: #bbb; background: #fafafa; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="{{logo}}" alt="HME Logo" style="max-width: 120px;">
            </div>
            <div class="content">
                <div class="revenue-badge">Revenue Alert</div>
                <h1 style="font-size: 20px; margin-top: 0; color: #111;">Subscription Payment Received! 💰</h1>
                <p style="color: #666; font-size: 14px;">A company has successfully activated a plan:</p>
                
                <table class="data-table">
                    <tr><td class="label">Company</td><td class="value">{{companyName}}</td></tr>
                    <tr><td class="label">Plan Name</td><td class="value">{{planName}}</td></tr>
                    <tr><td class="label">Amount</td><td class="value">R {{amount}}</td></tr>
                    <tr><td class="label">Type</td><td class="value">{{type}}</td></tr>
                    <tr><td class="label">Time</td><td class="value">{{timestamp}}</td></tr>
                </table>

                <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">
                    <p style="color: #111; font-weight: bold; font-size: 14px;">HME Revenue Monitoring</p>
                </div>
            </div>
            <div class="footer">
                Automated Transaction Report
            </div>
        </div>
    </div>
</body>
</html>
