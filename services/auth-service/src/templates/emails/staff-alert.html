<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
        .header { background: #0056b3; color: white; padding: 15px; text-align: center; }
        .content { padding: 30px; }
        .user-box { border-left: 4px solid #0056b3; background: #f0f7ff; padding: 15px; margin: 20px 0; }
        .footer { padding: 15px; text-align: center; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>New Staff Member Added 👥</h3>
        </div>
        <div class="content">
            <p>A company admin has added a new staff member to their workspace:</p>
            
            <div class="user-box">
                <p><b>Company:</b> {{companyName}}</p>
                <p><b>Added By:</b> {{adminName}}</p>
                <hr style="border:0; border-top: 1px solid #d0e4ff;">
                <p><b>New Staff Name:</b> {{staffName}}</p>
                <p><b>Role:</b> {{role}}</p>
                <p><b>Email:</b> {{email}}</p>
            </div>

            <p style="font-size: 12px;">Timestamp: {{timestamp}}</p>
        </div>
        <div class="footer">
            HME Intelligence Automated Audit System
        </div>
    </div>
</body>
</html>
