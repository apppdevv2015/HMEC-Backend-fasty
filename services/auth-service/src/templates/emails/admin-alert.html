<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container { font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: auto; border: 1px solid #ddd; border-radius: 8px; }
        .header { background: #2e7d32; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .footer { padding: 15px; text-align: center; font-size: 11px; color: #888; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h3>New Company Registration Alert 🏢</h3>
        </div>
        <div class="content">
            <p>A new company has registered on the platform:</p>
            <table class="data-table">
                <tr><td><b>Company Name:</b></td><td>{{companyName}}</td></tr>
                <tr><td><b>Admin Name:</b></td><td>{{adminName}}</td></tr>
                <tr><td><b>Email:</b></td><td>{{email}}</td></tr>
                <tr><td><b>Mobile:</b></td><td>{{mobile}}</td></tr>
                <tr><td><b>Timestamp:</b></td><td>{{timestamp}}</td></tr>
            </table>
        </div>
        <div class="footer">
            <p>HME Intelligence Automated Notification System</p>
        </div>
    </div>
</body>
</html>
