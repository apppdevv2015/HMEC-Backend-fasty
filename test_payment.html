<!DOCTYPE html>
<html>
<head>
    <title>PayFast Test Checkout - HME</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f9; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; width: 100%; }
        .btn:hover { background: #0056b3; }
        .details { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border: 1px solid #eee; }
        .details div { margin-bottom: 5px; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>HME Checkout</h2>
        <p>Test your subscription payment flow</p>
        
        <div class="details">
            <div><span class="label">Plan:</span> HME Plan: premium</div>
            <div><span class="label">Amount:</span> R 300.00</div>
            <div><span class="label">Payment ID:</span> 47fcf5e8-5189-4729-91fb-0bf88cae85f1</div>
        </div>

        <form action="https://sandbox.payfast.co.za/eng/process" method="post">
            <input type="hidden" name="merchant_id" value="10004002">
            <input type="hidden" name="merchant_key" value="q1cd2rdny4a53">
            <input type="hidden" name="amount" value="300.00">
            <input type="hidden" name="item_name" value="HME Plan: premium">
            <input type="hidden" name="m_payment_id" value="47fcf5e8-5189-4729-91fb-0bf88cae85f1">
            <input type="hidden" name="return_url" value="http://localhost:5173/company-admin/dashboard">
            <input type="hidden" name="cancel_url" value="http://localhost:5173/cart">
            <input type="hidden" name="notify_url" value="https://unpaid-rambling-creasing.ngrok-free.dev/api/v1/plans/webhook">
            
            <button type="submit" class="btn">Pay Now (Sandbox)</button>
        </form>
        
        <div style="margin-top: 15px; font-size: 12px; color: #999;">
            Note: This will redirect you to PayFast Sandbox environment.
        </div>
    </div>
</body>
</html>
